<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DPP Demo Bachelorarbeit</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #ffffff;
      color: #222;
    }

    .topbar {
      background-color: #f3c300;
      color: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 28px;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: bold;
    }

    .login-button {
      background: #111;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }
    

    .container {
      max-width: 1000px;
      margin: 30px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 20px;
    }

    .logo img {
      max-width: 180px;
      height: auto;
      display: block;
    }

    h1 {
      text-align: center;
      color: #0b4f6c;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 30px;
      align-items: center;
      margin-bottom: 30px;
      background: #eef3f7;
      padding: 20px;
      border-radius: 10px;
    }

    .hero-text {
      flex: 1;
      min-width: 260px;
    }

    .hero-image {
      flex: 1;
      min-width: 260px;
      text-align: center;
    }

    .hero-image img {
      max-width: 100%;
      width: 320px;
      border-radius: 10px;
    }

    details {
      margin-bottom: 15px;
      background: #f9fafb;
      border: 1px solid #d8dee4;
      border-radius: 8px;
      padding: 12px 16px;
    }

    summary {
      font-weight: bold;
      cursor: pointer;
      color: #0b4f6c;
    }

    details p, details ul {
      margin-top: 10px;
      line-height: 1.6;
    }

    footer {
      margin-top: 30px;
      text-align: center;
      font-size: 14px;
      color: #777;
    }
  </style>
</head>
<body>

  <script>
    const passwort = "dpp2026";
    const eingabe = prompt("Bitte Passwort eingeben:");

    if (eingabe !== passwort) {
      document.write("<h2 style='font-family: Arial; text-align:center; margin-top:100px;'>Zugriff verweigert</h2>");
      throw new Error("Falsches Passwort");
    }
